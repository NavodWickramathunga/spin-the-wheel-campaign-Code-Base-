<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // -------------------- Configurable Settings --------------------
  const CONFIG = {
    includeDismissButton: true,
    // Card background (a colour or a gradient). A moving neon border is drawn around it.
    background: "radial-gradient(120% 90% at 50% 0%, #3B1C8C 0%, #1A0B4F 45%, #0A0626 100%)",
    neonBorder: ["#22E1FF", "#FF2BD6", "#FFB800", "#8B5CF6"],
    enableConfettiOnWin: true,
    spinDurationSeconds: 5,
    // Sound effects (synthesised, no files), phone vibration and 3D wheel tilt.
    sound: true,
    haptics: true,
    tilt: true,
    // Small pill above the title. Leave "" to hide it.
    badgeText: "⚡ 1 Free Spin",
    spinButton: { text: "Spin Now", background: "linear-gradient(90deg, #FF2BD6 0%, #8B5CF6 50%, #22E1FF 100%)", color: "#ffffff" },
    // url: leave "" to just close the popup (the code is already shown and saved), or set a deep link to open a screen.
    claimButton: { enabled: true, text: "Collect Now", background: "linear-gradient(90deg, #FFB800 0%, #FF5E3A 50%, #FF2BD6 100%)", color: "#ffffff", url: "" },
    // CleverTap closes the popup for any wzrk:// link (note: wzrk, not wzkr).
    closeUrl: "wzrk://close",
    // After "Better luck next time" the popup closes by itself after this many seconds (0 = show a Close button instead).
    autoCloseNoWinSeconds: 3,
    // Backend address. Leave "" when this page is served by the same server (browser testing).
    // For CleverTap custom HTML set the full public HTTPS URL, e.g. "https://stw.example.com".
    apiBase: "https://stw-spin-wheel-1443.web.app",
    // The customer's CleverTap Identity (their mobile number). Put the Identity value between the quotes.
    // If left empty or still an unreplaced placeholder, the page falls back to ?identity= in the URL.
    identity: "{{Profile.Identity | default: '#'}}",
    // Wrap words in <span class='hl'>...</span> to give them the neon shimmer.
    mainTitle: { text: "Spin the Wheel<br><span class='hl'>& Win Big!</span>", fontSize: "30px", color: "#ffffff" },
    subtitle: { text: "Your chance to score discounts, free gifts, and exclusive perks is just a spin away.", fontSize: "14px", color: "#C9C3F0" },
    copyInstruction: { color: "#7A6A99", copiedColor: "#16A34A" },
    // Inside colour of the wheel's centre hub.
    centerCircle: { color: "#0A0626", borderColor: "#2B2B2B33", borderWidth: 2, radius: 15 },
    segmentColours: ["#FF2BD6", "#22E1FF", "#FFB800", "#8B5CF6"],
    noWinColour: "#2A2466",
    // When opened outside the app with no identity (CleverTap dashboard preview, desktop browser),
    // let the wheel do a local demo spin. Nothing is sent to the server and no voucher is issued.
    previewModeOutsideApp: true,
    // Shown instantly while the live rewards load from the server (the wheel then updates itself).
    // Keep this in line with the admin "Wheel segments" so the first view matches.
    defaultSegments: [
      { name: "Better luck next time", isNoWin: true },
      { name: "Rs. 500 Voucher", isNoWin: false },
      { name: "5GB Data", isNoWin: false },
      { name: "Free Coffee", isNoWin: false },
      { name: "Rs. 100 Reload", isNoWin: false },
    ],
    // The server can be slow on a cold start, so rewards are retried before giving up.
    rewardsLoadAttempts: 3,
    requestTimeoutSeconds: 12,
  };
  // -------------------- End of Configurable Settings --------------------
  // Hide the popup until the server confirms this customer can play (no flash before a silent close).
  // Safety net: it is shown anyway after 4 seconds.
  (function () {
    var id = String(CONFIG.identity || '').trim(), q = new URLSearchParams(location.search);
    if ((id && !/[{}#]/.test(id)) || q.get('identity') || q.get('mobile')) {
      document.documentElement.classList.add('stw-gate');
      setTimeout(function () { document.documentElement.classList.remove('stw-gate'); }, 4000);
    }
  })();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spin the Wheel – Win Big!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html.stw-gate body { visibility: hidden; }
  @property --ang { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
  :root {
    --spin-duration: 5;
    --font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: "Fredoka", "Poppins", -apple-system, "Segoe UI", Roboto, sans-serif;
    --cyan: #22E1FF; --pink: #FF2BD6; --amber: #FFB800; --violet: #8B5CF6;
    --wheel: clamp(200px, min(262px, 44vh, 76vw), 262px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; margin: 0; display: flex; align-items: center; justify-content: center; perspective: 1200px;
    background: transparent; font-family: var(--font); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

  /* ---------- card ---------- */
  .modal { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly; width: 100%; max-width: 336px; height: 100%; max-height: 610px; padding: 0 22px;
    color: #fff; text-align: center; border-radius: 32px; border: 2px solid transparent; background: #1A0B4F;
    box-shadow: 0 0 40px -6px rgba(255, 43, 214, .45), 0 30px 70px -20px rgba(0, 0, 0, .8);
    animation: modalIn .8s cubic-bezier(.2, 1.25, .35, 1) both, borderSpin 6s linear infinite; }
  .modal.leaving { animation: flipOut .45s cubic-bezier(.5, 0, .9, .5) forwards, borderSpin 6s linear infinite; }
  .modal.reward { height: auto; max-height: none; justify-content: center; gap: 12px; padding: 44px 24px 34px;
    animation: flipIn .75s cubic-bezier(.2, 1.2, .35, 1) both, borderSpin 6s linear infinite; }
  .modal::before { content: ""; position: absolute; inset: -45%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side at 28% 32%, rgba(255, 43, 214, .32), transparent),
                radial-gradient(closest-side at 74% 70%, rgba(34, 225, 255, .26), transparent),
                radial-gradient(closest-side at 70% 20%, rgba(139, 92, 246, .3), transparent);
    animation: aurora 20s linear infinite; }
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .grid { position: absolute; left: -30%; right: -30%; bottom: -10px; height: 34%; z-index: -1; pointer-events: none; opacity: .35;
    background: linear-gradient(transparent 0 92%, rgba(34, 225, 255, .9) 92%) 0 0 / 100% 22px,
                linear-gradient(90deg, transparent 0 96%, rgba(255, 43, 214, .9) 96%) 0 0 / 26px 100%;
    transform: perspective(220px) rotateX(58deg); transform-origin: bottom;
    -webkit-mask: linear-gradient(transparent, #000 70%); mask: linear-gradient(transparent, #000 70%);
    animation: gridMove 1.6s linear infinite; }
  .modal.reward .grid { display: none; }

  @keyframes borderSpin { to { --ang: 360deg; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(40px) scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes flipOut { to { opacity: .2; transform: rotateY(90deg) scale(.9); } }
  @keyframes flipIn { from { opacity: .2; transform: rotateY(-90deg) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes aurora { to { transform: rotate(360deg); } }
  @keyframes gridMove { to { background-position: 0 22px, 0 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .reveal { animation: rise .7s cubic-bezier(.2, .9, .3, 1.15) both; animation-delay: var(--d, 0s); }

  /* corner buttons */
  .close-btn, .sound-btn { position: absolute; top: 14px; z-index: 6; width: 34px; height: 34px; display: grid; place-items: center; padding: 0;
    border-radius: 50%; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); color: #fff; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); text-decoration: none; transition: transform .2s, background .2s;
    animation: rise .5s .6s both; }
  .close-btn { right: 14px; }
  .sound-btn { left: 14px; }
  .close-btn:active, .sound-btn:active { transform: scale(.88); background: rgba(255, 255, 255, .25); }
  .close-btn svg { width: 14px; height: 14px; }
  .sound-btn svg { width: 17px; height: 17px; }
  .sound-btn .x { display: none; }
  .sound-btn.muted .waves { display: none; }
  .sound-btn.muted .x { display: inline; }

  /* ---------- heading ---------- */
  .head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 30px; }
  .badge { display: inline-flex; padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--amber); background: rgba(255, 184, 0, .1); border: 1px solid rgba(255, 184, 0, .55);
    box-shadow: 0 0 14px rgba(255, 184, 0, .35), inset 0 0 10px rgba(255, 184, 0, .15); }
  .badge:empty { display: none; }
  h1 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.08; letter-spacing: .2px;
    text-shadow: 0 0 18px rgba(139, 92, 246, .8); }
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; animation: drop .7s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--base, 0s) + var(--i) * 30ms); }
  .hl .ch { text-shadow: none; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, #FFE27A, #FF2BD6, #22E1FF, #FFE27A); background-size: 400% 100%;
    filter: drop-shadow(0 0 10px rgba(255, 43, 214, .55));
    animation: drop .7s cubic-bezier(.2, 1.5, .4, 1) both, sheen 3.5s linear infinite;
    animation-delay: calc(var(--base, 0s) + var(--i) * 30ms), calc(var(--i) * -.15s); }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px) rotateX(90deg) scale(.5); } to { opacity: 1; transform: none; } }
  @keyframes sheen { to { background-position: 400% 0; } }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: #C9C3F0; font-weight: 500; max-width: 272px; }
  p.error { color: #FFE08A; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255, 184, 0, .12); border: 1px solid rgba(255, 184, 0, .5); animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  /* ---------- wheel ---------- */
  .wheel-zone { perspective: 900px; margin-top: 8px; }
  .wheel-zone.quake { animation: quake .5s cubic-bezier(.36, .07, .19, .97); }
  @keyframes quake { 10%, 90% { transform: translate(-1px, 1px); } 20%, 80% { transform: translate(3px, -2px); } 30%, 50%, 70% { transform: translate(-5px, 2px); } 40%, 60% { transform: translate(5px, -1px); } }
  .wheel-float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .wheel-container { position: relative; width: var(--wheel); height: var(--wheel); cursor: pointer;
    transform: rotateX(calc(var(--tx, 0deg) + var(--lean, 0deg))) rotateY(var(--ty, 0deg)) scale(var(--sc, 1));
    transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .wheel-container.spinning { --lean: 16deg; --sc: 1.04; }

  .orbit { position: absolute; inset: -16px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .22); pointer-events: none;
    animation: aurora 14s linear infinite; }
  .orbit i { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #fff; }
  .orbit i:nth-child(1) { top: 0; left: 50%; box-shadow: 0 0 10px 3px var(--cyan); }
  .orbit i:nth-child(2) { top: 75%; left: 6.7%; box-shadow: 0 0 10px 3px var(--pink); }
  .orbit i:nth-child(3) { top: 75%; left: 93.3%; box-shadow: 0 0 10px 3px var(--amber); }
  .wheel-container.spinning .orbit { animation-duration: 1.4s; }

  .wheel-glow { position: absolute; inset: -26px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 43, 214, .5) 0%, rgba(34, 225, 255, .25) 45%, transparent 70%);
    animation: glowPulse 2.8s ease-in-out infinite; }
  .wheel-container.spinning .wheel-glow { animation-duration: .6s; }
  @keyframes glowPulse { 0%, 100% { opacity: .6; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }

  .wheel-rim { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from var(--ang), var(--cyan), var(--pink), var(--amber), var(--violet), var(--cyan));
    box-shadow: 0 0 22px rgba(255, 43, 214, .6), 0 0 44px rgba(34, 225, 255, .3), 0 18px 34px -10px rgba(0, 0, 0, .8); }
  .wheel-rim::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #0A0626; }
  .wheel-face { position: absolute; inset: 15px; border-radius: 50%; overflow: hidden; background: #0A0626; }
  .wheel-face.idle { animation: nudge 4.5s ease-in-out 2s infinite; }
  @keyframes nudge { 0%, 78%, 100% { transform: rotate(0); } 84% { transform: rotate(-8deg); } 91% { transform: rotate(4deg); } 96% { transform: rotate(-1.5deg); } }
  canvas#wheelCanvas { display: block; width: 100%; height: 100%; border-radius: 50%; transform: rotate(0deg); will-change: transform, filter;
    transition: transform calc(var(--spin-duration) * 1s) cubic-bezier(0.01, 0.05, 0.05, 1); }
  .wheel-gloss { position: absolute; inset: 15px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(110% 70% at 30% 8%, rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, 0) 45%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15), inset 0 0 26px rgba(0, 0, 0, .55); }

  .bulb { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff;
    transform: rotate(var(--a)) translateY(calc(var(--bulb-r, 124px) * -1));
    animation: chase var(--dur, 1.8s) linear infinite; animation-delay: calc(var(--k) * var(--dur, 1.8s) * -1); }
  .wheel-container.spinning .bulb { --dur: .5s; }
  @keyframes chase { 0%, 100% { opacity: 1; box-shadow: 0 0 8px 3px var(--c); } 50% { opacity: .25; box-shadow: none; } }

  .pointer { position: absolute; top: -20px; left: 50%; width: 36px; height: 46px; margin-left: -18px; z-index: 4; pointer-events: none;
    transform-origin: 50% 32%; filter: drop-shadow(0 0 8px rgba(255, 43, 214, .9)) drop-shadow(0 4px 4px rgba(0, 0, 0, .5)); }
  .pointer svg { width: 100%; height: 100%; display: block; }
  .pointer.tick { animation: tick .16s ease-out; }
  .wheel-container.landed .pointer { animation: bounce .7s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tick { 0% { transform: rotate(0); } 35% { transform: rotate(-26deg); } 100% { transform: rotate(0); } }
  @keyframes bounce { 0% { transform: none; } 30% { transform: translateY(-10px) scale(1.15); } 100% { transform: none; } }

  .hub { position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; z-index: 3; border-radius: 50%; display: grid; place-items: center;
    transform: translate(-50%, -50%); background: conic-gradient(from var(--ang), var(--cyan), var(--pink), var(--amber), var(--cyan));
    box-shadow: 0 0 18px rgba(255, 43, 214, .7), 0 6px 14px rgba(0, 0, 0, .6); }
  .hub::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background-color: var(--hub, #0A0626);
    background-image: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .22), transparent 60%); }
  .hub span { position: relative; font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 8px var(--cyan), 0 0 16px var(--pink); }
  .wheel-container:not(.spinning):not(.landed) .hub { animation: hubPulse 1.6s ease-in-out infinite; }
  @keyframes hubPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }

  .shock { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff; opacity: 0; pointer-events: none; box-shadow: 0 0 20px var(--pink), inset 0 0 20px var(--cyan); }
  .wheel-container.landed .shock { animation: shock .9s cubic-bezier(.1, .7, .3, 1); }
  .wheel-container.landed .shock.s2 { animation-delay: .15s; }
  @keyframes shock { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.7); } }

  /* ---------- buttons ---------- */
  .btn-wrap { display: flex; justify-content: center; }
  .action-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; min-width: 220px;
    padding: 16px 40px; border: 0; border-radius: 999px; font: 700 18px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase;
    text-decoration: none; cursor: pointer; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    background: linear-gradient(90deg, #FF2BD6, #8B5CF6, #22E1FF); background-size: 200% 100% !important;
    animation: flow 3s linear infinite, breathe 2.2s ease-in-out infinite; transition: transform .12s, filter .25s, opacity .25s; }
  .action-btn::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .6), transparent); animation: shine 2.8s ease-in-out 1.5s infinite; }
  .action-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), inset 0 -3px 0 rgba(0, 0, 0, .2); pointer-events: none; }
  .action-btn:active:not(:disabled) { transform: scale(.95); }
  .action-btn:disabled { cursor: default; filter: saturate(.6) brightness(.85); }
  .action-btn:disabled::before { animation: none; }
  @keyframes flow { to { background-position: 200% 0; } }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 16px rgba(255, 43, 214, .55), 0 0 34px rgba(34, 225, 255, .25); } 50% { box-shadow: 0 0 26px rgba(255, 43, 214, .85), 0 0 50px rgba(34, 225, 255, .5); } }
  @keyframes shine { 0% { left: -60%; } 45%, 100% { left: 140%; } }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: rgba(255, 255, 255, .55); pointer-events: none; animation: ripple .6s ease-out forwards; }
  @keyframes ripple { to { transform: scale(18); opacity: 0; } }

  /* ---------- result ---------- */
  .reward-hero { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .rays { position: absolute; inset: -40px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 226, 122, .5) 0deg 8deg, transparent 8deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 66%); mask: radial-gradient(circle, #000 15%, transparent 66%);
    animation: aurora 16s linear infinite; }
  .ring { position: absolute; border-radius: 50%; }
  .ring.r1 { inset: 4px; border: 2px dashed rgba(34, 225, 255, .7); animation: aurora 12s linear infinite; }
  .ring.r2 { inset: 16px; border: 3px solid transparent; border-top-color: var(--pink); border-bottom-color: var(--amber);
    filter: drop-shadow(0 0 6px var(--pink)); animation: aurora 2.4s linear infinite reverse; }
  .ring.core { inset: 26px; background: radial-gradient(circle, rgba(255, 255, 255, .35), rgba(139, 92, 246, .25) 55%, transparent 72%); }
  .orbiter { position: absolute; inset: 0; animation: aurora 3.5s linear infinite; }
  .orbiter i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; }
  .orbiter i:nth-child(1) { top: 0; left: 50%; box-shadow: 0 0 10px 3px var(--cyan); }
  .orbiter i:nth-child(2) { top: 50%; left: 100%; box-shadow: 0 0 10px 3px var(--amber); }
  .orbiter i:nth-child(3) { top: 100%; left: 50%; box-shadow: 0 0 10px 3px var(--pink); }
  .hero-icon { position: relative; font-size: 60px; line-height: 1; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .5));
    animation: pop .9s cubic-bezier(.2, 1.7, .4, 1) .25s both, float 3s ease-in-out 1.2s infinite; }
  .reward-hero.lose .rays, .reward-hero.lose .orbiter { opacity: .25; filter: grayscale(1); }
  .reward-hero.lose .ring.r2 { animation-duration: 8s; opacity: .5; }
  .reward-hero.lose .hero-icon { animation: pop .9s cubic-bezier(.2, 1.7, .4, 1) .25s both, sway 3s ease-in-out 1.2s infinite; }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  .reward-title { margin: 4px 0 0; font-size: 30px; }
  .prize-chip { display: inline-block; padding: 8px 18px; border-radius: 14px; font: 700 20px/1.2 var(--display); color: #fff;
    background: linear-gradient(90deg, rgba(255, 43, 214, .25), rgba(34, 225, 255, .25)); border: 1px solid rgba(255, 255, 255, .35);
    box-shadow: 0 0 22px rgba(255, 43, 214, .45), inset 0 0 14px rgba(34, 225, 255, .25); text-shadow: 0 0 10px rgba(255, 255, 255, .6); }
  .prize-chip:empty { display: none; }
  .reward-subtext { font-size: 13.5px; font-weight: 500; line-height: 1.5; color: #C9C3F0; max-width: 270px; }

  .reward-wrapper { display: none; position: relative; width: 100%; margin-top: 4px; filter: drop-shadow(0 0 18px rgba(34, 225, 255, .35)) drop-shadow(0 12px 18px rgba(0, 0, 0, .5)); }
  .reward-wrapper.visible { display: block; animation: ticketIn .9s cubic-bezier(.2, 1.3, .4, 1) .55s both; }
  @keyframes ticketIn { from { opacity: 0; transform: perspective(500px) translateY(40px) rotateX(70deg); } to { opacity: 1; transform: none; } }
  .reward-box { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 100%; padding: 16px 22px 14px; border-radius: 16px; cursor: pointer; color: #2A1052;
    background: linear-gradient(135deg, #FFFFFF 0%, #F5EDFF 55%, #E3FAFF 100%);
    -webkit-mask: radial-gradient(circle 11px at 0 58%, transparent 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at 100% 58%, transparent 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 11px at 0 58%, transparent 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at 100% 58%, transparent 98%, #000) right / 51% 100% no-repeat; }

      } else if (ctIOS) {

    } catch (e) { /* analytics must never break the game */ }
  }

    } catch (e) { /* never break the game */ }

    return new Promise((resolve) => {
      (function attempt(n) {
        fetchJson(CONFIG.apiBase + '/api/rewards')
          .then((res) => {
            const list = Array.isArray(res.data) ? res.data.filter((s) => s && s.name) : [];
            if (!res.ok || !list.length) throw new Error('no rewards');
            setSegments(list);
            liveRewards = true;
            updateSpinButton();
            resolve();
          })
          .catch(() => {
            if (n < CONFIG.rewardsLoadAttempts) setTimeout(() => attempt(n + 1), 1500 * n);
            else resolve();
          });
      })(1);
    });
  }

  setupCanvas();
  setSegments((CONFIG.defaultSegments || []).filter((s) => s && s.name));
  if (window.ResizeObserver) new ResizeObserver(() => { setupCanvas(); drawWheel(); }).observe(wheelContainer);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel); // redraw labels once the font loads
  spinStars.start();
  if (identity || previewMode) showSubtitle(CONFIG.subtitle.text + (previewMode ? ' (Preview mode)' : ''));
  else showMessage('Please open this page from the MyDialog app to spin the wheel.');
  updateSpinButton();
  trackEvent('Spin Wheel Viewed', { preview: previewMode });
  const rewardsReady = loadRewards();
  // Campaign schedule: show "closed, opens at ..." up front instead of after a tap.
  // Status gate (the page stays hidden until this answers, at most 4 s - see the top of the file):
  // paused / outside the schedule -> close without showing anything;
  // already won / out of spins -> show why, and the button just closes.
  const reveal = () => document.documentElement.classList.remove('stw-gate');
  if (identity && !previewMode) {
    fetchJson(CONFIG.apiBase + '/api/status?identity=' + encodeURIComponent(identity)).then((res) => {
      const st = res.ok && res.data ? res.data : {};
      if (isSpinning || hasSpun) return reveal();
      if (st.open === false) {
        trackEvent('Spin Wheel Not Shown', { reason: st.paused ? 'paused' : 'schedule' });
        return closePopup();
      }
      if (st.eligible === false) {
        trackEvent('Spin Wheel Not Eligible', { reason: String(st.reason || '') });
        closeOnly = true;
        showMessage(st.message || "You can't spin right now.");
        updateSpinButton();
      }
      reveal();
    }).catch(reveal); // server unreachable: show the wheel; the spin itself is still checked
  } else reveal();
})();
</script>
</body>
</html>
