<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // -------------------- Configurable Settings --------------------
  const CONFIG = {
    includeDismissButton: true,
    // Card background (used by both the wheel screen and the result screen).
    background: "linear-gradient(165deg, #FF3D8B 0%, #A12CF2 38%, #5B14D0 72%, #2B0B86 100%)",
    enableConfettiOnWin: true,
    spinDurationSeconds: 5,
    // Sound effects (synthesised, no files; a mute button is shown), phone vibration and 3D wheel tilt.
    sound: true,
    haptics: true,
    tilt: true,
    // Small pill above the title. Leave "" to hide it.
    badgeText: "✨ 1 Free Spin",
    spinButton: { text: "Spin Now", background: "linear-gradient(180deg, #FFEB9C 0%, #FFC83D 55%, #F5A300 100%)", color: "#4A1C00" },
    // url: leave "" to just close the popup (the code is already shown and saved), or set a deep link to open a screen.
    claimButton: { enabled: true, text: "Collect Now", background: "linear-gradient(180deg, #FF6BA4 0%, #F4357D 55%, #D81B63 100%)", color: "#ffffff", url: "" },
    // CleverTap closes the popup for any wzrk:// link (note: wzrk, not wzkr).
    closeUrl: "wzrk://close",
    // After "Better luck next time" the popup closes by itself after this many seconds (0 = show a Close button instead).
    autoCloseNoWinSeconds: 3,
    // Backend address. Leave "" when this page is served by the same server (browser testing).
    // For CleverTap custom HTML set the full public HTTPS URL, e.g. "https://stw.example.com".
    apiBase: "https://stw-spin-wheel-1443.web.app",
    // The customer's CleverTap Identity (their mobile number). Put the Identity value between the quotes.
    // If left empty or still an unreplaced placeholder, the page falls back to ?identity= in the URL.
    identity: "{{Profile.Identity | default: '#'}}",
    // Wrap words in <span class='hl'>...</span> to give them the gold highlight.
    mainTitle: { text: "🎉 Spin the Wheel <br><span class='hl'>& Win Big!</span>", fontSize: "26px", color: "#ffffff" },
    subtitle: { text: "Your chance to score discounts, free gifts, and exclusive perks is just a spin away.", fontSize: "14px", color: "#F3E8FF" },
    copyInstruction: { color: "#7A6A99", copiedColor: "#16A34A" },
    // Centre hub of the wheel (gold ring with this colour inside).
    centerCircle: { color: "#7C3AED", borderColor: "#2B2B2B33", borderWidth: 2, radius: 15 },
    segmentColours: ["#FFFFFF", "#FF3D6E", "#FFC23D", "#2EC5FF"],
    noWinColour: "#4B2E83",
    // When opened outside the app with no identity (CleverTap dashboard preview, desktop browser),
    // let the wheel do a local demo spin. Nothing is sent to the server and no voucher is issued.
    previewModeOutsideApp: true,
    // Shown instantly while the live rewards load from the server (the wheel then updates itself).
    // Keep this in line with the admin "Wheel segments" so the first view matches.
    defaultSegments: [
      { name: "Better luck next time", isNoWin: true },
      { name: "Rs. 500 Voucher", isNoWin: false },
      { name: "5GB Data", isNoWin: false },
      { name: "Free Coffee", isNoWin: false },
      { name: "Rs. 100 Reload", isNoWin: false },
    ],
    // The server can be slow on a cold start, so rewards are retried before giving up.
    rewardsLoadAttempts: 3,
    requestTimeoutSeconds: 12,
  };
  // -------------------- End of Configurable Settings --------------------
  // Hide the popup until the server confirms this customer can play (no flash before a silent close).
  // Safety net: it is shown anyway after 4 seconds.
  (function () {
    var id = String(CONFIG.identity || '').trim(), q = new URLSearchParams(location.search);
    if ((id && !/[{}#]/.test(id)) || q.get('identity') || q.get('mobile')) {
      document.documentElement.classList.add('stw-gate');
      setTimeout(function () { document.documentElement.classList.remove('stw-gate'); }, 4000);
    }
  })();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spin the Wheel – Win Big!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html.stw-gate body { visibility: hidden; }
  :root {
    --spin-duration: 5;
    --font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --gold: #FFD45C;
    --wheel: clamp(200px, min(264px, 44vh, 78vw), 264px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; margin: 0; display: flex; align-items: center; justify-content: center; perspective: 1200px;
    background: transparent; font-family: var(--font); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

  /* ---------- card ---------- */
  .modal { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly; width: 100%; max-width: 330px; height: 100%; max-height: 600px; padding: 0 22px;
    color: #fff; text-align: center; border-radius: 32px;
    background: linear-gradient(165deg, #FF3D8B 0%, #A12CF2 38%, #5B14D0 72%, #2B0B86 100%);
    box-shadow: 0 30px 60px -20px rgba(30, 0, 80, .7);
    animation: modalIn .7s cubic-bezier(.2, 1.25, .35, 1) both; }
  .modal::before { content: ""; position: absolute; inset: -45%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side at 30% 35%, rgba(255, 120, 210, .45), transparent),
                radial-gradient(closest-side at 72% 66%, rgba(80, 170, 255, .38), transparent);
    animation: aurora 18s linear infinite; }
  .modal::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .modal.leaving { animation: flipOut .45s cubic-bezier(.5, 0, .9, .5) forwards; }
  .modal.reward { height: auto; max-height: none; justify-content: center; gap: 12px; padding: 44px 24px 34px;
    animation: flipIn .75s cubic-bezier(.2, 1.2, .35, 1) both; }

  @keyframes modalIn { from { opacity: 0; transform: translateY(28px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes flipOut { to { opacity: .2; transform: rotateY(90deg) scale(.9); } }
  @keyframes flipIn { from { opacity: .2; transform: rotateY(-90deg) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes aurora { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .reveal { animation: rise .6s cubic-bezier(.2, .9, .3, 1.15) both; animation-delay: var(--d, 0s); }

  /* twinkling stars */
  .sparkles { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .sparkle { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 1px rgba(255, 255, 255, .8);
    animation: twinkle var(--t, 3s) ease-in-out infinite; animation-delay: var(--d, 0s); opacity: 0; }
  .sparkle.star { background: none; box-shadow: none; color: #FFF3C4; line-height: 1; text-shadow: 0 0 8px rgba(255, 230, 150, .9); }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: .95; transform: scale(1); } }

  /* corner buttons */
  .close-btn, .sound-btn { position: absolute; top: 14px; z-index: 6; width: 34px; height: 34px; display: grid; place-items: center; padding: 0;
    border-radius: 50%; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); color: #fff; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); text-decoration: none;
    transition: transform .2s, background .2s; animation: rise .5s .5s both; }
  .close-btn { right: 14px; }
  .sound-btn { left: 14px; }
  .close-btn:active, .sound-btn:active { transform: scale(.88); background: rgba(255, 255, 255, .28); }
  .close-btn svg { width: 14px; height: 14px; }
  .sound-btn svg { width: 17px; height: 17px; }
  .sound-btn .x { display: none; }
  .sound-btn.muted .waves { display: none; }
  .sound-btn.muted .x { display: inline; }

  /* ---------- heading ---------- */
  .head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; }
  .badge { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase; color: #FFE793; background: rgba(255, 255, 255, .13);
    border: 1px solid rgba(255, 231, 147, .4); box-shadow: 0 0 18px rgba(255, 214, 102, .25); }
  .badge:empty { display: none; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; text-shadow: 0 3px 14px rgba(50, 0, 110, .5); }
  h1 .hl { background: linear-gradient(180deg, #FFF6CF 0%, #FFD45C 55%, #FFAE00 100%); -webkit-background-clip: text; background-clip: text;
    color: transparent; filter: drop-shadow(0 2px 6px rgba(255, 170, 0, .35)); }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: #F3E8FF; font-weight: 500; max-width: 270px; }
  p.error { color: #FFE08A; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255, 200, 60, .14); border: 1px solid rgba(255, 214, 102, .45); animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  /* letter-by-letter titles */
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; animation: drop .65s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--base, 0s) + var(--i) * 30ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-26px) rotateX(90deg) scale(.5); } to { opacity: 1; transform: none; } }

  /* ---------- wheel ---------- */
  .wheel-zone { perspective: 900px; margin-top: 10px; }
  .wheel-zone.quake { animation: quake .5s cubic-bezier(.36, .07, .19, .97); }
  @keyframes quake { 10%, 90% { transform: translate(-1px, 1px); } 20%, 80% { transform: translate(3px, -2px); } 30%, 50%, 70% { transform: translate(-4px, 2px); } 40%, 60% { transform: translate(4px, -1px); } }
  .wheel-float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .wheel-container { position: relative; width: var(--wheel); height: var(--wheel); cursor: pointer;
    transform: rotateX(calc(var(--tx, 0deg) + var(--lean, 0deg))) rotateY(var(--ty, 0deg)) scale(var(--sc, 1));
    transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .wheel-container.spinning { --lean: 14deg; --sc: 1.03; }

  .orbit { position: absolute; inset: -15px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .25); pointer-events: none;
    animation: aurora 16s linear infinite; }
  .orbit i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #FFF8DC; box-shadow: 0 0 8px 2px rgba(255, 214, 92, .9); }
  .orbit i:nth-child(1) { top: 0; left: 50%; }
  .orbit i:nth-child(2) { top: 75%; left: 6.7%; }
  .orbit i:nth-child(3) { top: 75%; left: 93.3%; }
  .wheel-container.spinning .orbit { animation-duration: 1.6s; }

  .wheel-glow { position: absolute; inset: -22px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 214, 102, .55) 0%, rgba(255, 61, 139, .28) 48%, transparent 70%);
    animation: glowPulse 2.8s ease-in-out infinite; }
  .wheel-container.spinning .wheel-glow { animation-duration: .7s; }
  .wheel-container.landed .wheel-glow { animation: glowFlash .9s ease-out 2; }
  @keyframes glowPulse { 0%, 100% { opacity: .65; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
  @keyframes glowFlash { 0% { opacity: 1; transform: scale(1); } 40% { opacity: 1; transform: scale(1.12); filter: brightness(1.6); } 100% { opacity: .7; transform: scale(1); } }

  .wheel-rim { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, #FFE793, #F5B92E, #B8740A, #FFE08A, #F5B92E, #9E6206, #FFE793);
    box-shadow: 0 16px 32px -8px rgba(20, 0, 60, .7), inset 0 0 0 2px rgba(255, 255, 255, .45), inset 0 -4px 10px rgba(80, 40, 0, .5); }
  .wheel-face { position: absolute; inset: 14px; border-radius: 50%; overflow: hidden; background: #2B0B86; }
  .wheel-face.idle { animation: nudge 4.5s ease-in-out 1.6s infinite; }
  @keyframes nudge { 0%, 78%, 100% { transform: rotate(0); } 84% { transform: rotate(-7deg); } 91% { transform: rotate(4deg); } 96% { transform: rotate(-1.5deg); } }
  canvas#wheelCanvas { display: block; width: 100%; height: 100%; border-radius: 50%; transform: rotate(0deg); will-change: transform, filter;
    transition: transform calc(var(--spin-duration) * 1s) cubic-bezier(0.01, 0.05, 0.05, 1); }
  .wheel-gloss { position: absolute; inset: 14px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(120% 80% at 30% 12%, rgba(255, 255, 255, .32) 0%, rgba(255, 255, 255, 0) 45%);
    box-shadow: inset 0 0 0 3px rgba(120, 60, 0, .35), inset 0 0 24px rgba(20, 0, 50, .4); }

  .bulb { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%;
    background: #FFF8DC; transform: rotate(var(--a)) translateY(calc(var(--bulb-r, 125px) * -1));
    animation: chase var(--dur, 2s) linear infinite; animation-delay: calc(var(--k) * var(--dur, 2s) * -1); }
  .wheel-container.spinning .bulb { --dur: .5s; }
  @keyframes chase { 0%, 100% { opacity: 1; box-shadow: 0 0 7px 3px rgba(255, 225, 130, .95); } 50% { opacity: .3; box-shadow: none; } }

  .pointer { position: absolute; top: -18px; left: 50%; width: 34px; height: 44px; margin-left: -17px; z-index: 4;
    transform-origin: 50% 32%; filter: drop-shadow(0 4px 4px rgba(40, 0, 80, .5)); pointer-events: none; }
  .pointer svg { width: 100%; height: 100%; display: block; }
  .pointer.tick { animation: tick .16s ease-out; }
  .wheel-container.landed .pointer { animation: bounce .7s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tick { 0% { transform: rotate(0); } 35% { transform: rotate(-24deg); } 100% { transform: rotate(0); } }
  @keyframes bounce { 0% { transform: translateY(0); } 30% { transform: translateY(-9px) scale(1.12); } 100% { transform: none; } }

  .hub { position: absolute; left: 50%; top: 50%; width: 23%; height: 23%; z-index: 3; border-radius: 50%; display: grid; place-items: center;
    transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 28%, #FFF6C8, #F5B92E 55%, #A86A06);
    box-shadow: 0 6px 14px rgba(30, 0, 60, .55), inset 0 -3px 6px rgba(120, 60, 0, .5); }
  .hub::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; background-color: var(--hub, #7C3AED);
    background-image: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .5), transparent 60%); box-shadow: inset 0 2px 5px rgba(0, 0, 0, .35); }
  .hub span { position: relative; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .45); }
  .wheel-container:not(.spinning):not(.landed) .hub { animation: hubPulse 1.8s ease-in-out infinite; }
  @keyframes hubPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

  .shock { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #FFF3C4; opacity: 0; pointer-events: none; box-shadow: 0 0 18px rgba(255, 214, 92, .9); }
  .wheel-container.landed .shock { animation: shock .9s cubic-bezier(.1, .7, .3, 1); }
  .wheel-container.landed .shock.s2 { animation-delay: .15s; }
  @keyframes shock { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.6); } }

  /* ---------- buttons ---------- */
  .btn-wrap { display: flex; justify-content: center; }
  .action-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; min-width: 210px;
    padding: 15px 40px; border: 0; border-radius: 999px; font: 800 16px/1 var(--font); letter-spacing: .6px; text-transform: uppercase;
    text-decoration: none; cursor: pointer; background: #fff; color: #1d1d1d;
    box-shadow: 0 5px 0 rgba(60, 10, 40, .35), 0 16px 26px -8px rgba(20, 0, 60, .6), inset 0 2px 0 rgba(255, 255, 255, .6);
    transition: transform .12s, box-shadow .12s, filter .25s, opacity .25s; }
  .action-btn::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .75), transparent); animation: shine 3s ease-in-out 1.2s infinite; }
  .action-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(60, 10, 40, .35), 0 8px 16px -8px rgba(20, 0, 60, .6), inset 0 2px 0 rgba(255, 255, 255, .6); }
  .action-btn:disabled { cursor: default; filter: saturate(.55) brightness(.92); opacity: .85; }
  .action-btn:disabled::before { animation: none; }
  @keyframes shine { 0% { left: -60%; } 45%, 100% { left: 140%; } }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: rgba(255, 255, 255, .55); pointer-events: none; animation: ripple .6s ease-out forwards; }
  @keyframes ripple { to { transform: scale(18); opacity: 0; } }

  /* ---------- result ---------- */
  .reward-hero { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }
  .rays { position: absolute; inset: -38px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 228, 140, .55) 0deg 9deg, transparent 9deg 24deg);
    -webkit-mask: radial-gradient(circle, #000 16%, transparent 66%); mask: radial-gradient(circle, #000 16%, transparent 66%);
    animation: aurora 16s linear infinite; }
  .ring { position: absolute; border-radius: 50%; }
  .ring.core { inset: 24px; background: radial-gradient(circle, rgba(255, 240, 190, .7), rgba(255, 120, 200, .2) 60%, transparent 72%); }
  .ring.r1 { inset: 4px; border: 2px dashed rgba(255, 255, 255, .55); animation: aurora 12s linear infinite; }
  .ring.r2 { inset: 14px; border: 3px solid transparent; border-top-color: #FFD45C; border-bottom-color: #FF8FC7;
    filter: drop-shadow(0 0 5px rgba(255, 214, 92, .9)); animation: aurora 2.6s linear infinite reverse; }
  .orbiter { position: absolute; inset: 0; animation: aurora 3.6s linear infinite; }
  .orbiter i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; }
  .orbiter i:nth-child(1) { top: 0; left: 50%; box-shadow: 0 0 9px 3px rgba(255, 214, 92, .95); }
  .orbiter i:nth-child(2) { top: 50%; left: 100%; box-shadow: 0 0 9px 3px rgba(255, 255, 255, .9); }
  .orbiter i:nth-child(3) { top: 100%; left: 50%; box-shadow: 0 0 9px 3px rgba(255, 143, 199, .95); }
  .hero-icon { position: relative; font-size: 58px; line-height: 1; filter: drop-shadow(0 6px 12px rgba(40, 0, 80, .45));
    animation: pop .9s cubic-bezier(.2, 1.7, .4, 1) .25s both, float 3s ease-in-out 1.2s infinite; }
  .reward-hero.lose .rays, .reward-hero.lose .orbiter { opacity: .3; filter: grayscale(1); }
  .reward-hero.lose .ring.r2 { animation-duration: 8s; opacity: .5; }
  .reward-hero.lose .hero-icon { animation: pop .9s cubic-bezier(.2, 1.7, .4, 1) .25s both, sway 3s ease-in-out 1.2s infinite; }
  @keyframes pop { from { transform: scale(0) rotate(-25deg); } to { transform: none; } }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  .reward-title { margin: 2px 0 0; font-size: 26px; font-weight: 800; line-height: 1.2; }
  .prize-chip { display: inline-block; padding: 8px 18px; border-radius: 14px; font-size: 18px; font-weight: 800; color: #fff;
    background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .4); box-shadow: 0 0 22px rgba(255, 214, 92, .35);
    text-shadow: 0 1px 8px rgba(60, 0, 120, .4); }
  .prize-chip:empty { display: none; }
  .reward-subtext { font-size: 13.5px; font-weight: 500; line-height: 1.5; color: #F3E8FF; max-width: 270px; }

  .reward-wrapper { display: none; position: relative; width: 100%; margin-top: 4px; filter: drop-shadow(0 12px 18px rgba(25, 0, 70, .45)); }
  .reward-wrapper.visible { display: block; animation: ticketIn .9s cubic-bezier(.2, 1.3, .4, 1) .55s both; }
  @keyframes ticketIn { from { opacity: 0; transform: perspective(500px) translateY(40px) rotateX(70deg); } to { opacity: 1; transform: none; } }
  .reward-box { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 100%; padding: 16px 22px 14px; border-radius: 16px; cursor: pointer; color: #2A1052;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF4DE 100%);
    -webkit-mask: radial-gradient(circle 11px at 0 58%, transparent 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at 100% 58%, transparent 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 11px at 0 58%, transparent 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at 100% 58%, transparent 98%, #000) right / 51% 100% no-repeat; }
  .reward-box::before { content: ""; position: absolute; inset: 7px; border: 1.5px dashed rgba(124, 58, 237, .35); border-radius: 11px; pointer-events: none; }
  .holo { position: absolute; inset: 0; pointer-events: none; opacity: .45; background-size: 300% 100%;
    background-image: linear-gradient(115deg, transparent 25%, rgba(255, 61, 139, .2) 38%, rgba(124, 58, 237, .18) 48%, rgba(255, 214, 92, .3) 58%, transparent 72%);
    animation: holo 3.5s linear infinite; }
  @keyframes holo { from { background-position: 100% 0; } to { background-position: -200% 0; } }
  .ticket-label { position: relative; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #9B7BD1; }
  .reward-main { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 100%; }
  #rewardText { font: 800 22px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 2px; color: #5B14D0; word-break: break-all; }
  #rewardText.scrambling { color: #A78BFA; }
  .copy-btn { flex-shrink: 0; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; cursor: pointer;
    background: #F1E8FF; transition: transform .15s, background .2s; }
  .copy-btn:active { transform: scale(.88); }
  .copy-btn svg { width: 18px; height: 18px; }

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const spinModal = $('spinModal'), rewardModal = $('rewardModal'), subtitleEl = $('subtitle');
  const wheelCanvas = $('wheelCanvas'), wheelContainer = document.querySelector('.wheel-container');
  const wheelRim = $('wheelRim'), wheelFace = $('wheelFace'), wheelZone = $('wheelZone'), pointerEl = $('pointer');
  const ctx = wheelCanvas.getContext('2d');
  const spinButton = $('actionButton'), claimButton = $('claimButton');
  const rewardWrapper = $('rewardWrapper'), rewardBox = $('rewardBox');
  const copyInstructionEl = $('copyInstruction');
  const TAU = Math.PI * 2;
  const rnd = (a, b) => Math.random() * (b - a) + a;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  // Celebration colours, matched to the card (gold, pink, purple, white, sky).
  const PALETTE = ['#FFD45C', '#FFC23D', '#FF6BA4', '#FF3D8B', '#A78BFA', '#7C3AED', '#FFFFFF', '#7DD3FC'];
  let segments = [], liveRewards = false, isSpinning = false, hasSpun = false, currentRotation = 0;
  let closeOnly = false; // this customer can't play now (already won / out of spins): the button just closes
  let highlightIndex = -1; // winning segment, the others are dimmed after landing

  // ---- CleverTap bridge (Android: window.CleverTap, iOS: webkit message handler) ----
  const ctAndroid = window.CleverTap;
  const ctIOS = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap;
  const inApp = !!(ctAndroid || ctIOS);

  function trackEvent(name, props) {
    try {
      if (ctAndroid && ctAndroid.pushEvent) {
        if (props) ctAndroid.pushEvent(name, JSON.stringify(props)); else ctAndroid.pushEvent(name);
      } else if (ctIOS) {
        ctIOS.postMessage({ action: 'recordEventWithProps', event: name, properties: props || {} });
      }
    } catch (e) { /* analytics must never break the game */ }
  }
  function pushProfile(props) {
    try {
      if (ctAndroid && ctAndroid.pushProfile) ctAndroid.pushProfile(JSON.stringify(props));
      else if (ctIOS) ctIOS.postMessage({ action: 'profilePush', properties: props });
    } catch (e) { /* never break the game */ }
  }
  // Real wins only: the event triggers the CleverTap push campaign that re-sends the code,
  // and the profile keeps the last code so it is never lost.
  function recordWin(data) {
    if (data.preview || !data.won || !data.voucherCode) return;
    const props = { voucher_code: String(data.voucherCode), reward: String(data.reward || ''), voucher_value: String(data.voucherValue || '') };
    trackEvent('Spin Wheel Won', props);
    pushProfile({ 'STW Last Voucher Code': props.voucher_code, 'STW Last Reward': props.reward, 'STW Last Voucher Value': props.voucher_value });
  }
  // Closing is done by the tapped link itself (href = closeUrl): iOS CleverTap only acts on
  // links the user actually taps, not on location.href set from script. This runs on that tap.
  // Close from script (iOS CleverTap only acts on a clicked link, so one is clicked).
  function closePopup() {
    onCloseTap();
    const a = document.createElement('a');
    a.href = CONFIG.closeUrl;
    document.body.appendChild(a);
    a.click();
  }
  function onCloseTap() {
    trackEvent('Spin Wheel Closed', { spun: hasSpun });
    try {
      if (ctAndroid && ctAndroid.dismissInAppNotification) ctAndroid.dismissInAppNotification();
    } catch (e) { /* the link still closes it */ }
  }

  // Identity (mobile number) comes from CleverTap / the MyDialog app link (?identity=...)
  const cfgIdentity = String(CONFIG.identity || '').trim();
  const params = new URLSearchParams(location.search);
  const identity = (cfgIdentity && !/[{}#]/.test(cfgIdentity) ? cfgIdentity : params.get('identity') || params.get('mobile') || '').trim();
  const previewMode = !identity && !inApp && CONFIG.previewModeOutsideApp;

  // ---- sound (Web Audio, no files) + haptics ----
  let actx = null, soundOn = !!CONFIG.sound;
  function audio() {
    if (!soundOn) return null;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol) {
    const a = audio(); if (!a) return;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    s.buffer = buf; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  const sfx = {
    start: () => tone(330, .35, 'triangle', .05, 0, 990),
    tick: () => tone(rnd(1500, 1800), .03, 'square', .02),
    land: () => { tone(160, .3, 'sine', .12, 0, 60); noise(.2, .18); },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => { tone(f, .28, 'triangle', .07, i * .09); tone(f * 2, .2, 'sine', .02, i * .09 + .03); }),
    lose: () => { tone(392, .3, 'sine', .06); tone(311, .5, 'sine', .06, .22); },
    boom: () => { noise(.45, .28); tone(90, .35, 'sine', .07, 0, 40); },
    lock: () => tone(rnd(900, 1200), .03, 'square', .012),
    copy: () => { tone(880, .08, 'sine', .07); tone(1320, .14, 'sine', .07, .07); },
  };
  function buzz(pattern) {
    if (!CONFIG.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* not supported */ }
  }
  document.querySelectorAll('.sound-btn').forEach((b) => {
    if (!CONFIG.sound) { b.style.display = 'none'; return; }
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      document.querySelectorAll('.sound-btn').forEach((x) => x.classList.toggle('muted', !soundOn));
      if (soundOn) tone(880, .08, 'sine', .05);
    });
  });

  // ---- full-screen effects layer: sparks, fireworks, confetti ----
  const fx = (function () {
    const c = document.createElement('canvas');
    Object.assign(c.style, { position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 9999 });
    document.body.appendChild(c);
    const g = c.getContext('2d');
    let W = 0, H = 0, ps = [], raf = 0;
    function size() {
      const d = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    }
    size(); addEventListener('resize', size);
    function add(p) {
      ps.push(Object.assign({ kind: 'spark', vx: 0, vy: 0, grav: 0, drag: 1, life: 0, ttl: 60, size: 2, col: '#fff', fade: 30 }, p));
      if (!raf) raf = requestAnimationFrame(step);
    }
    function explode(p) {
      add({ kind: 'flash', x: p.x, y: p.y, size: 32, ttl: 14, fade: 14, col: 'rgba(255,245,210,.9)' });
      const n = 56;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + rnd(-.05, .05), v = rnd(2, 5.2);
        add({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, grav: .05, drag: .975, ttl: rnd(55, 90), size: rnd(1.4, 2.5), col: p.cols[i % p.cols.length], trail: 3, fade: 35 });
      }
      sfx.boom(); buzz(20);
    }
    function step() {
      g.clearRect(0, 0, W, H);
      const keep = [];
      for (let k = 0; k < ps.length; k++) {
        const p = ps[k];
        p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav;
        if (p.tilt !== undefined) { p.tilt += p.vt; p.rot += p.vr; p.x += Math.sin(p.tilt) * (p.sway || 0); }
        p.x += p.vx; p.y += p.vy;
        if (p.kind === 'rocket' && (p.vy > -1.2 || p.life > p.ttl)) { explode(p); continue; }
        if (p.life >= p.ttl || p.y > H + 40) continue;
        g.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.life) / p.fade));
        if (p.kind === 'spark' || p.kind === 'rocket') {
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = p.col; g.lineWidth = p.size; g.lineCap = 'round';
          g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * (p.trail || 2), p.y - p.vy * (p.trail || 2)); g.stroke();
        } else if (p.kind === 'flash') {
          g.globalCompositeOperation = 'lighter';
          const r = p.size * (1 + p.life / p.ttl), gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          gr.addColorStop(0, p.col); gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, r, 0, TAU); g.fill();
        } else {
          g.globalCompositeOperation = 'source-over';
          g.fillStyle = p.col; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.tilt));
          if (p.kind === 'circle') { g.beginPath(); g.arc(0, 0, p.w / 2, 0, TAU); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          g.restore();
        }
        keep.push(p);
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      ps = keep;
      raf = ps.length ? requestAnimationFrame(step) : 0;
    }
    return {
      sparks(x, y, n, cols, power) {
        for (let i = 0; i < n; i++) {
          const a = rnd(0, TAU), v = rnd(power * .4, power);
          add({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, grav: .12, drag: .95, ttl: rnd(18, 34), size: rnd(1.2, 2.2), col: pick(cols), fade: 14 });
        }
      },
      fireworks(count) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            add({ kind: 'rocket', x: rnd(W * .2, W * .8), y: H + 10, vx: rnd(-1, 1), vy: -rnd(H / 70, H / 58), grav: .17, ttl: 140, size: 2.4, col: '#FFE9A8', trail: 4,
              cols: [pick(PALETTE), pick(PALETTE), '#FFF3C4'] });
          }, i * 420);
        }
      },
      confetti() {
        const cannon = (x, ang) => {
          for (let i = 0; i < 60; i++) {
            const a = ang + rnd(-.4, .4), v = rnd(10, 22);
            add({ kind: pick(['rect', 'rect', 'circle']), x: x, y: H * .9, vx: Math.cos(a) * v, vy: Math.sin(a) * v, grav: .32, drag: .985,
              w: rnd(6, 10), h: rnd(8, 14), rot: rnd(0, TAU), vr: rnd(-.25, .25), tilt: rnd(0, TAU), vt: rnd(.06, .16), sway: .8, ttl: rnd(150, 220), fade: 40, col: pick(PALETTE) });
          }
        };
        cannon(0, -Math.PI / 3); cannon(W, -2 * Math.PI / 3);
        for (let i = 0; i < 60; i++) {
          add({ kind: pick(['rect', 'circle', 'rect']), x: rnd(0, W), y: rnd(-H * .6, -10), vx: rnd(-1, 1), vy: rnd(2, 4), grav: .03, drag: .995,
            w: rnd(6, 10), h: rnd(8, 14), rot: rnd(0, TAU), vr: rnd(-.2, .2), tilt: rnd(0, TAU), vt: rnd(.05, .12), sway: 1.2, ttl: 420, fade: 40, col: pick(PALETTE) });
        }
      },
    };
  })();

  // ---- letter-by-letter title ----
  function splitLetters(el, baseDelay) {
    let idx = 0;
    (function walk(node) {
      Array.from(node.childNodes).forEach((n) => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach((part) => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
            const w = document.createElement('span'); w.className = 'word';
            Array.from(part).forEach((ch) => {
              const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
              s.style.setProperty('--i', idx++); w.appendChild(s);
            });
            frag.appendChild(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
      });
    })(el);
    el.style.setProperty('--base', baseDelay);
  }

  // ---- apply config ----
  spinModal.style.background = CONFIG.background;
  rewardModal.style.background = CONFIG.background;
  document.documentElement.style.setProperty('--spin-duration', CONFIG.spinDurationSeconds);
  $('badge').textContent = CONFIG.badgeText || '';
  $('mainTitle').innerHTML = CONFIG.mainTitle.text;
  $('mainTitle').style.fontSize = CONFIG.mainTitle.fontSize;
  $('mainTitle').style.color = CONFIG.mainTitle.color;
  subtitleEl.style.fontSize = CONFIG.subtitle.fontSize;
  subtitleEl.style.color = CONFIG.subtitle.color;
  copyInstructionEl.style.color = CONFIG.copyInstruction.color;
  $('hub').style.setProperty('--hub', CONFIG.centerCircle.color);
  spinButton.textContent = CONFIG.spinButton.text;
  spinButton.style.background = CONFIG.spinButton.background;
  spinButton.style.color = CONFIG.spinButton.color;
  document.querySelectorAll('.close-btn').forEach((b) => {
    b.href = CONFIG.closeUrl;
    if (!CONFIG.includeDismissButton) b.style.display = 'none';
    else b.addEventListener('click', onCloseTap);
  });

  // ---- decoration: twinkling stars + rim bulbs ----
  function addSparkles(modal, n) {
    const box = modal.querySelector('.sparkles');
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      const star = i % 4 === 0;
      s.className = 'sparkle' + (star ? ' star' : '');
      if (star) { s.textContent = '✦'; s.style.fontSize = rnd(9, 15) + 'px'; }
      else { const d = rnd(2, 4) + 'px'; s.style.width = d; s.style.height = d; }
      s.style.left = rnd(4, 96) + '%'; s.style.top = rnd(3, 97) + '%';
      s.style.setProperty('--d', rnd(0, 4).toFixed(2) + 's');
      s.style.setProperty('--t', rnd(2.2, 4.5).toFixed(2) + 's');
      box.appendChild(s);
    }
  }
  addSparkles(spinModal, 22);
  addSparkles(rewardModal, 18);
  const BULBS = 18;
  for (let i = 0; i < BULBS; i++) {
    const b = document.createElement('i');
    b.className = 'bulb';
    b.style.setProperty('--a', (i * 360 / BULBS) + 'deg');
    b.style.setProperty('--k', i / BULBS);
    wheelRim.appendChild(b);
  }

  // ---- button ripple ----
  document.querySelectorAll('.action-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      if (btn.disabled) return;
      const r = btn.getBoundingClientRect(), s = document.createElement('span');
      s.className = 'ripple'; s.style.left = (e.clientX - r.left) + 'px'; s.style.top = (e.clientY - r.top) + 'px';
      btn.appendChild(s); setTimeout(() => s.remove(), 650);
    });
  });

  // ---- 3D tilt (finger / mouse, and phone motion where available) ----
  function setTilt(x, y) {
    wheelContainer.style.setProperty('--tx', x.toFixed(1) + 'deg');
    wheelContainer.style.setProperty('--ty', y.toFixed(1) + 'deg');
  }
  if (CONFIG.tilt) {
    const clamp = (v) => Math.max(-8, Math.min(8, v));
    spinModal.addEventListener('pointermove', (e) => {
      if (isSpinning || hasSpun) return;
      const r = wheelZone.getBoundingClientRect();
      setTilt(clamp(-((e.clientY - r.top) / r.height - .5) * 18), clamp(((e.clientX - r.left) / r.width - .5) * 18));
    });
    spinModal.addEventListener('pointerleave', () => setTilt(0, 0));
    addEventListener('deviceorientation', (e) => {
      if (isSpinning || hasSpun || e.beta == null) return;
      setTilt(clamp(-(e.beta - 50) / 3), clamp(e.gamma / 3));
    });
  }

  function showMessage(text) {
    subtitleEl.textContent = text;
    subtitleEl.classList.remove('error'); void subtitleEl.offsetWidth; // replay the shake
    subtitleEl.classList.add('error');
  }
  function showSubtitle(text) {
    subtitleEl.textContent = text;
    subtitleEl.classList.remove('error');
  }
  function updateSpinButton() {
    if (closeOnly) { spinButton.disabled = false; spinButton.textContent = 'Close'; return; }
    spinButton.disabled = isSpinning || hasSpun || !segments.length || !(identity || previewMode);
    spinButton.textContent = isSpinning ? 'Spinning…' : hasSpun ? 'Good luck!' : CONFIG.spinButton.text;
  }

  // ---- network ----
  function fetchJson(url, options) {
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), CONFIG.requestTimeoutSeconds * 1000) : null;
    return fetch(url, Object.assign({}, options, ctrl ? { signal: ctrl.signal } : {}))
      .then((resp) => resp.json().catch(() => ({})).then((data) => ({ ok: resp.ok, data: data })))
      .finally(() => { if (timer) clearTimeout(timer); });
  }

  // ---- colour helpers ----
  const isHex = (c) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c));
  function rgb(hex) {
    let h = hex.slice(1);
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function shade(hex, amt) {
    const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
    const c = rgb(hex);
    return 'rgb(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')';
  }
  function isLight(col) {
    if (!isHex(col)) return false;
    const c = rgb(col);
    return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] > 165;
  }

  // ---- wheel drawing ----
  function setupCanvas() {
    const size = Math.max(140, wheelFace.clientWidth); // layout size, unaffected by entrance / tilt transforms
    const dpr = window.devicePixelRatio || 1;
    wheelCanvas.style.width = wheelCanvas.style.height = size + 'px';
    wheelCanvas.width = wheelCanvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wheelCanvas._size = size;
    wheelContainer.style.setProperty('--bulb-r', (wheelRim.clientWidth / 2 - 7) + 'px');
  }
  function colourFor(seg, i) {
    return seg.isNoWin ? CONFIG.noWinColour : CONFIG.segmentColours[i % CONFIG.segmentColours.length];
  }
  // Word-wrap a label, shrinking the font until it fits the segment.
  function layoutLabel(text, maxW, fs) {
    for (; ; fs--) {
      ctx.font = '800 ' + fs + 'px Poppins, -apple-system, "Segoe UI", Roboto, sans-serif';
      const lines = []; let line = '';
      text.split(' ').forEach((w) => {
        const test = line ? line + ' ' + w : w;
        if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; } else line = test;
      });
      lines.push(line);
      const fits = lines.length <= 3 && lines.every((l) => ctx.measureText(l).width <= maxW);
      if (fits || fs <= 9) return { lines: lines, fs: fs };
    }
  }
  function drawWheel() {
    if (!segments.length) return;
    const size = wheelCanvas._size, R = size / 2, arc = TAU / segments.length;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(R, R);
    segments.forEach((seg, i) => {
      const col = colourFor(seg, i), a0 = i * arc;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a0 + arc); ctx.closePath();
      if (isHex(col)) {
        const g = ctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
        g.addColorStop(0, shade(col, 0.28)); g.addColorStop(0.65, col); g.addColorStop(1, shade(col, -0.2));
        ctx.fillStyle = g;
      } else ctx.fillStyle = col;
      ctx.fill();
      if (highlightIndex >= 0 && i !== highlightIndex) { ctx.fillStyle = 'rgba(20, 0, 50, .5)'; ctx.fill(); }

      // label
      ctx.save();
      ctx.rotate(a0 + arc / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const light = isLight(col);
      ctx.fillStyle = light ? '#3A1460' : '#fff';
      if (!light) { ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1; }
      const lab = layoutLabel(seg.name, R * 0.45, Math.max(11, Math.round(size * 0.05)));
      const lh = lab.fs * 1.12, total = (lab.lines.length - 1) * lh;
      lab.lines.forEach((l, k) => ctx.fillText(l, R * 0.9, k * lh - total / 2));
      ctx.restore();
    });
    // gold dividers
    ctx.strokeStyle = 'rgba(255, 220, 120, .95)';
    ctx.lineWidth = Math.max(1.5, size * 0.009);
    segments.forEach((_, i) => {
      ctx.save(); ctx.rotate(i * arc);
      ctx.beginPath(); ctx.moveTo(R * 0.2, 0); ctx.lineTo(R, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(R * 0.93, 0, Math.max(2, size * 0.012), 0, TAU); ctx.fillStyle = '#FFE9A8'; ctx.fill();
      ctx.restore();
    });
    // glowing gold outline on the winner
    if (highlightIndex >= 0) {
      const a0 = highlightIndex * arc;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R - 2, a0, a0 + arc); ctx.closePath();
      ctx.strokeStyle = '#FFF3C4'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.shadowColor = '#FFD45C'; ctx.shadowBlur = 18; ctx.stroke();
    }
    ctx.restore();
  }

  // ---- spin ----
  function resultIndex(data) {
    const n = segments.length;
    // segmentIndex refers to the server's list, so only trust it when that list is on the wheel.
    if (liveRewards && Number.isInteger(data.segmentIndex) && data.segmentIndex >= 0 && data.segmentIndex < n &&
        segments[data.segmentIndex].name === data.reward) return data.segmentIndex;
    // Server did not send a usable index: find the segment by name, else any segment of the right kind.
    let i = segments.findIndex((s) => data.won && s.name === data.reward);
    if (i < 0) i = segments.findIndex((s) => !!s.isNoWin === !data.won);
    return i < 0 ? 0 : i;
  }

  function previewResult() {
    const i = Math.floor(Math.random() * segments.length), seg = segments[i];
    return seg.isNoWin
      ? { won: false, segmentIndex: i, preview: true }
      : { won: true, segmentIndex: i, reward: seg.name, voucherValue: 'PREVIEW', voucherCode: 'PREVIEW-CODE', preview: true };
  }

  // Watches the wheel while it turns: pointer flick + tick sound + sparks at each divider, motion blur by speed.
  let watchRaf = 0, lastSeg = null, lastTick = 0, lastAngle = null;
  function wheelAngle() {
    const m = /matrix\(([^)]+)\)/.exec(getComputedStyle(wheelCanvas).transform || '');
    if (!m) return 0;
    const p = m[1].split(',');
    return Math.atan2(parseFloat(p[1]), parseFloat(p[0])) * 180 / Math.PI;
  }
  function tickPointer(speed) {
    pointerEl.classList.remove('tick'); void pointerEl.offsetWidth; pointerEl.classList.add('tick');
    sfx.tick(); buzz(5);
    if (speed < 14) {
      const r = pointerEl.getBoundingClientRect();
      fx.sparks(r.left + r.width / 2, r.bottom - 6, 6, ['#FFE9A8', '#FFD45C', '#FFFFFF'], 4);
    }
  }
  function startSpinFx() {
    wheelFace.classList.remove('idle');
    wheelContainer.classList.add('spinning');
    setTilt(0, 0);
    sfx.start(); buzz(15);
    lastSeg = null; lastAngle = null;
    cancelAnimationFrame(watchRaf);
    const step = (t) => {
      const ang = wheelAngle(), segDeg = 360 / segments.length;
      let speed = 0;
      if (lastAngle !== null) speed = Math.abs(((ang - lastAngle + 540) % 360) - 180);
      lastAngle = ang;
      wheelCanvas.style.filter = speed > 5 ? 'blur(' + Math.min(2.2, (speed - 5) * 0.22).toFixed(2) + 'px)' : '';
      const s = Math.floor((((ang + 90) % 360) + 360) % 360 / segDeg);
      if (lastSeg !== null && s !== lastSeg && t - lastTick > 45) { tickPointer(speed); lastTick = t; }
      lastSeg = s;
      watchRaf = requestAnimationFrame(step);
    };
    watchRaf = requestAnimationFrame(step);
  }
  function endSpinFx() {
    cancelAnimationFrame(watchRaf);
    wheelCanvas.style.filter = '';
    wheelContainer.classList.remove('spinning');
  }

  // The wheel starts turning on the tap and keeps turning until the server's result arrives,
  // then eases out onto the won segment, so a slow server never looks like a frozen button.
  let freeSpinRaf = 0;
  function startFreeSpin() {
    wheelCanvas.style.transition = 'none';
    let last = performance.now();
    const step = (t) => {
      currentRotation += (t - last) * 0.6; // degrees per ms
      last = t;
      wheelCanvas.style.transform = 'rotate(' + currentRotation + 'deg)';
      freeSpinRaf = requestAnimationFrame(step);
    };
    freeSpinRaf = requestAnimationFrame(step);
  }
  function stopFreeSpin() {
    cancelAnimationFrame(freeSpinRaf);
    wheelCanvas.style.transform = 'rotate(' + currentRotation + 'deg)';
    void wheelCanvas.offsetWidth; // apply the current angle before the CSS transition comes back
    wheelCanvas.style.transition = '';
  }

  async function spin() {
    if (closeOnly) return;
    if (spinButton.disabled || isSpinning || !segments.length) return;
    isSpinning = true;
    updateSpinButton();
    showSubtitle(CONFIG.subtitle.text);
    trackEvent('Spin Wheel Spun', { preview: previewMode });
    startFreeSpin();
    startSpinFx();

    let data;
    if (previewMode) {
      await rewardsReady;
      data = previewResult();
    } else {
      try {
        // The server decides the result (voucher allocation, caps, 30-day rule); the wheel just animates to it.
        // Wait for the live rewards too, so segmentIndex matches the wheel being shown.
        const both = await Promise.all([fetchJson(CONFIG.apiBase + '/api/spin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identity: identity }),
        }), rewardsReady]);
        const res = both[0];
        if (!res.ok) {
          stopFreeSpin(); endSpinFx();
          if (res.data.closed || res.data.ineligible) closeOnly = true;
          showMessage(res.data.error || 'Something went wrong. Please try again.');
          isSpinning = false; updateSpinButton(); return;
        }
        data = res.data;
      } catch (e) {
        stopFreeSpin(); endSpinFx();
        showMessage('Network error. Please check your connection and try again.');
        isSpinning = false; updateSpinButton(); return;
      }
    }

    stopFreeSpin();
    hasSpun = true;
    const segDeg = 360 / segments.length;
    const winIndex = resultIndex(data);
    // Pointer is at the top (canvas angle 270deg); bring the centre of the chosen segment under it.
    const target = (270 - (winIndex + 0.5) * segDeg + 720) % 360;
    const cur = ((currentRotation % 360) + 360) % 360;
    currentRotation += ((target - cur + 360) % 360) + 360 * (4 + Math.floor(Math.random() * 3));
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      wheelCanvas.removeEventListener('transitionend', finish);
      isSpinning = false;
      endSpinFx();
      highlightIndex = winIndex; drawWheel();
      wheelContainer.classList.add('landed');
      wheelZone.classList.add('quake');
      sfx.land(); buzz(40);
      const r = wheelContainer.getBoundingClientRect();
      fx.sparks(r.left + r.width / 2, r.top + 8, 24, PALETTE, 7);
      showReward(data);
    };
    wheelCanvas.addEventListener('transitionend', finish);
    setTimeout(finish, CONFIG.spinDurationSeconds * 1000 + 800); // fallback
    wheelCanvas.style.transform = 'rotate(' + currentRotation + 'deg)';
  }

  function iconFor(name) {
    const n = String(name || '');
    if (/coffee|tea|cafe/i.test(n)) return '☕';
    if (/data|\bgb\b|\bmb\b|\d\s*gb/i.test(n)) return '📶';
    if (/voucher|coupon/i.test(n)) return '🎟️';
    if (/reload|recharge|cash|rs\.?\s*\d/i.test(n)) return '💰';
    return '🎁';
  }

  // Slot-machine reveal of the voucher code; the real code is kept in data-code for copying.
  function scrambleCode(el, code) {
    const pool = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', len = code.length, dur = 1300;
    el.dataset.code = code;
    el.classList.add('scrambling');
    let start = 0, locked = 0;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / dur), n = Math.floor(p * len);
      if (n > locked) { locked = n; sfx.lock(); }
      let s = code.slice(0, n);
      for (let i = n; i < len; i++) s += /[\s-]/.test(code[i]) ? code[i] : pool[Math.floor(Math.random() * pool.length)];
      el.textContent = s;
      if (p < 1) requestAnimationFrame(step);
      else { el.textContent = code; el.classList.remove('scrambling'); buzz(15); }
    };
    requestAnimationFrame(step);
  }

  function showReward(data) {
    trackEvent('Spin Wheel Result', { won: !!data.won, reward: data.won ? String(data.reward || '') : 'none', preview: !!data.preview });
    recordWin(data);
    const previewNote = data.preview ? ' (Preview only - no real voucher.)' : '';
    $('rewardTitle').textContent = data.won ? 'Congratulations!' : 'Better luck next time!';
    $('prizeChip').textContent = data.won ? 'You won ' + String(data.reward || '') : '';
    $('rewardSubtext').textContent = (data.won
      ? 'Voucher value: ' + data.voucherValue + '. Use the code below to redeem your reward.' + (data.expiryDate ? ' Valid until ' + data.expiryDate + '.' : '')
      : 'No reward this time. Thanks for playing!') + previewNote;
    $('rewardText').textContent = '';
    $('heroIcon').textContent = data.won ? iconFor(data.reward) : '🍀';
    $('rewardHero').classList.toggle('lose', !data.won);
    rewardWrapper.classList.toggle('visible', !!data.won && !!data.voucherCode);
    if (data.won) rewardBox.classList.add('pulsate-animation');
    claimButton.textContent = data.won ? CONFIG.claimButton.text : 'Close';
    claimButton.style.background = CONFIG.claimButton.background;
    claimButton.style.color = CONFIG.claimButton.color;
    claimButton.style.display = data.won && !CONFIG.claimButton.enabled ? 'none' : '';
    // The tap follows this href: a deep link if one is set for winners, otherwise the close link.
    const openUrl = data.won && CONFIG.claimButton.url;
    claimButton.href = openUrl || CONFIG.closeUrl;
    claimButton.onclick = () => {
      if (data.won) trackEvent('Spin Wheel Claimed', { reward: String(data.reward || ''), preview: !!data.preview });
      if (!openUrl) onCloseTap();
    };

    // Let the landed segment glow for a moment, then flip the card over.
    setTimeout(() => {
      spinModal.classList.add('leaving');
      setTimeout(() => {
        spinModal.style.display = 'none';
        rewardModal.style.display = 'flex';
        splitLetters($('rewardTitle'), '.35s');
        if (data.won) {
          sfx.win(); buzz([30, 40, 60]);
          if (data.voucherCode) setTimeout(() => scrambleCode($('rewardText'), String(data.voucherCode)), 900);
          if (CONFIG.enableConfettiOnWin) { setTimeout(() => fx.confetti(), 250); setTimeout(() => fx.fireworks(3), 700); }
        } else {
          sfx.lose();
          if (CONFIG.autoCloseNoWinSeconds > 0) autoCloseNoWin(CONFIG.autoCloseNoWinSeconds);
        }
      }, 430);
    }, 1200);
  }

  // No win: hide the Close button, count down, then close. iOS only closes on a link click,
  // so the close link is clicked from script; the × stays as a backup.
  function autoCloseNoWin(seconds) {
    claimButton.style.display = 'none';
    const bar = $('countdown');
    bar.style.setProperty('--dur', seconds + 's');
    bar.classList.add('run');
    const sub = $('rewardSubtext'), base = sub.textContent;
    const tick = () => {
      if (seconds <= 0) {
        onCloseTap();
        const a = document.createElement('a');
        a.href = CONFIG.closeUrl;
        document.body.appendChild(a);
        a.click();
        return;
      }
      sub.textContent = base + ' Closing in ' + seconds + '...';
      seconds--;
      setTimeout(tick, 1000);
    };
    tick();
  }

  // ---- copy ----
  function copyCode() {
    const el = $('rewardText'), text = el.dataset.code || el.textContent;
    if (!text) return;
    const ok = () => {
      copyInstructionEl.textContent = 'Code copied!';
      copyInstructionEl.style.color = CONFIG.copyInstruction.copiedColor;
      rewardBox.classList.add('copied');
      const toast = $('toast'); toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
      const r = $('copyBtn').getBoundingClientRect();
      fx.sparks(r.left + r.width / 2, r.top + r.height / 2, 16, ['#4ADE80', '#FFFFFF', '#FFD45C'], 5);
      sfx.copy(); buzz(20);
      trackEvent('Spin Wheel Code Copied');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(() => fallback(text, ok));
    else fallback(text, ok);
  }
  function fallback(text, ok) {
    const i = document.createElement('input');
    i.value = text; i.style.position = 'absolute'; i.style.left = '-9999px';
    document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); ok();
  }
  $('copyBtn').addEventListener('click', (e) => { e.stopPropagation(); copyCode(); });
  rewardWrapper.addEventListener('click', copyCode);

  spinButton.addEventListener('click', spin);
  spinButton.addEventListener('click', () => { if (closeOnly) closePopup(); });
  wheelContainer.addEventListener('click', spin);
  wheelCanvas.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } });

  // ---- init: draw the default segments at once, then swap in the admin-configured rewards ----
  function setSegments(list) {
    segments = list.length < 2 ? list.concat(list) : list.slice();
    drawWheel();
  }
  // Resolves when the live rewards are on the wheel, or when all attempts failed (defaults stay).
  function loadRewards() {
    return new Promise((resolve) => {
      (function attempt(n) {
        fetchJson(CONFIG.apiBase + '/api/rewards')
          .then((res) => {
            const list = Array.isArray(res.data) ? res.data.filter((s) => s && s.name) : [];
            if (!res.ok || !list.length) throw new Error('no rewards');
            setSegments(list);
            liveRewards = true;
            updateSpinButton();
            resolve();
          })
          .catch(() => {
            if (n < CONFIG.rewardsLoadAttempts) setTimeout(() => attempt(n + 1), 1500 * n);
            else resolve();
          });
      })(1);
    });
  }

  setupCanvas();
  setSegments((CONFIG.defaultSegments || []).filter((s) => s && s.name));
  if (window.ResizeObserver) new ResizeObserver(() => { setupCanvas(); drawWheel(); }).observe(wheelContainer);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel); // redraw labels once Poppins loads
  if (identity || previewMode) showSubtitle(CONFIG.subtitle.text + (previewMode ? ' (Preview mode)' : ''));
  else showMessage('Please open this page from the MyDialog app to spin the wheel.');
  updateSpinButton();
  trackEvent('Spin Wheel Viewed', { preview: previewMode });
  const rewardsReady = loadRewards();
  // Campaign schedule: show "closed, opens at ..." up front instead of after a tap.
  // Status gate (the page stays hidden until this answers, at most 4 s - see the top of the file):
  // paused / outside the schedule -> close without showing anything;
  // already won / out of spins -> show why, and the button just closes.
  const reveal = () => document.documentElement.classList.remove('stw-gate');
  if (identity && !previewMode) {
    fetchJson(CONFIG.apiBase + '/api/status?identity=' + encodeURIComponent(identity)).then((res) => {
      const st = res.ok && res.data ? res.data : {};
      if (isSpinning || hasSpun) return reveal();
      if (st.open === false) {
        trackEvent('Spin Wheel Not Shown', { reason: st.paused ? 'paused' : 'schedule' });
        return closePopup();
      }
      if (st.eligible === false) {
        trackEvent('Spin Wheel Not Eligible', { reason: String(st.reason || '') });
        closeOnly = true;
        showMessage(st.message || "You can't spin right now.");
        updateSpinButton();
      }
      reveal();
    }).catch(reveal); // server unreachable: show the wheel; the spin itself is still checked
  } else reveal();
})();
</script>
</body>
</html>
